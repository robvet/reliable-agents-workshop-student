name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'src/app/**'
      - 'src/Dockerfile'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: reliableagentsacr
  RESOURCE_GROUP: rg-reliableagents
  IMAGE: backend
  CONTAINER_APP: ca-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build & push image (server-side ACR build)
        run: az acr build --registry "$ACR_NAME" --image "$IMAGE:${{ github.sha }}" --file src/Dockerfile .

      - name: Update Container App to new image
        run: az containerapp update -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" --image "$ACR_NAME.azurecr.io/$IMAGE:${{ github.sha }}"
