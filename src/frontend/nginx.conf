# nginx: serve the ReliableAgents static frontend and reverse-proxy the API
# paths through APIM to the backend Container App. Same-origin browser calls
# => no CORS needed. This file is an envsubst TEMPLATE (see Dockerfile) — the
# nginx:alpine entrypoint substitutes ${APIM_SUBSCRIPTION_KEY} from the
# container's env at startup and writes the result to conf.d/default.conf.

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Static site with SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API reverse proxy -> APIM gateway -> backend Container App.
    # APIM's default (non-custom-domain) hostname routing requires Host to
    # match the gateway FQDN, and proxy_ssl_server_name must be on for TLS SNI.
    location ~ ^/(health|chat|map|prompt-library|generator|outages) {
        proxy_pass               https://apim-reliableagents.azure-api.net;
        proxy_set_header Host    apim-reliableagents.azure-api.net;
        proxy_ssl_server_name    on;

        proxy_set_header Ocp-Apim-Subscription-Key ${APIM_SUBSCRIPTION_KEY};

        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # NDJSON streaming for /chat/stream — never buffer the response.
        proxy_buffering    off;
        proxy_read_timeout 300s;
    }
}
